services:
  mysql:
    image: mysql:8.0
    container_name: financial-report-analysis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_demo_password
      MYSQL_DATABASE: financial_demo
      MYSQL_USER: financial_demo
      MYSQL_PASSWORD: financial_demo_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - financial_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_demo_password"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  financial_mysql_data:
